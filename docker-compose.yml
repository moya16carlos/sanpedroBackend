services:
  web:
    build: .
    container_name: san_pedro_conecta_backend
    restart: unless-stopped
    env_file:
      - .env

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./firebase-admin.json:/app/firebase-admin.json:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sanpedro.rule=Host(`sanpedro.liceosp.cl`)"
      - "traefik.http.routers.sanpedro.entrypoints=websecure"
      - "traefik.http.routers.sanpedro.tls=true"
      - "traefik.http.routers.sanpedro.tls.certresolver=letsencrypt"
      - "traefik.http.services.sanpedro.loadbalancer.server.port=8000"

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

volumes:
  static_data:
  media_data: